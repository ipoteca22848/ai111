name: StreamForge Windows EXE
on:
  push:
    tags: ['v1.*']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Bundle official multilingual Whisper model
        run: python tools/prepare_model.py
      - name: Test real processing and GUI
        run: python tools/check_tests.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Download upstream speech regression sample (checksum verified)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Invoke-WebRequest https://raw.githubusercontent.com/SYSTRAN/faster-whisper/master/tests/data/jfk.flac -OutFile build/speech.flac
          $hash = (Get-FileHash build/speech.flac -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "63a4b1e4c1dc655ac70961ffbf518acd249df237e5a0152faae9a4a836949715") { throw "Speech fixture checksum mismatch" }
      - name: Verify speech recognition and end-to-end source pipeline
        run: python main.py --self-test build/source-selftest build/speech.flac
      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name StreamForgeStudio --add-data "assets;assets" --collect-all faster_whisper --collect-all ctranslate2 --collect-all tokenizers --collect-all av --collect-all onnxruntime --collect-all imageio_ffmpeg --collect-all yt_dlp --copy-metadata imageio-ffmpeg --copy-metadata yt-dlp --copy-metadata faster-whisper main.py
      - name: Verify FFmpeg, Whisper and export inside the EXE
        shell: pwsh
        run: |
          $env:STREAMFORGE_DATA_DIR = "$env:RUNNER_TEMP/streamforge-selftest-data"
          $env:HF_HUB_OFFLINE = "1"
          $arguments = @("--self-test", "$pwd/build/exe-selftest", "$pwd/build/speech.flac")
          $process = Start-Process dist/StreamForgeStudio.exe -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $details = (Get-Content "$env:STREAMFORGE_DATA_DIR/studio.log" -Raw -ErrorAction SilentlyContinue) -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Output "::error title=Packaged processing diagnostics::$details"
            throw "Packaged processing test failed: $($process.ExitCode)"
          }
          $result = Get-Content build/exe-selftest/result.json | ConvertFrom-Json
          if (!$result.ok -or !$result.speech_verified) { throw "Incomplete packaged self-test" }
      - name: Verify packaged GUI startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:STREAMFORGE_DATA_DIR = "$env:RUNNER_TEMP/streamforge-gui"
          $app = Start-Process dist/StreamForgeStudio.exe -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) {
            Get-Content "$env:STREAMFORGE_DATA_DIR/studio.log" -ErrorAction SilentlyContinue
            throw "Packaged GUI exited unexpectedly: $($app.ExitCode)"
          }
          if (!(Test-Path "$env:STREAMFORGE_DATA_DIR/streamforge.db")) { Stop-Process -Id $app.Id; throw "Database was not initialized" }
          Stop-Process -Id $app.Id
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/StreamForgeStudio.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  StreamForgeStudio.exe" | Set-Content dist/StreamForgeStudio.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForgeStudio-Windows
          path: |
            dist/StreamForgeStudio.exe
            dist/StreamForgeStudio.exe.sha256
            build/exe-selftest/result.json
      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/StreamForgeStudio.exe dist/StreamForgeStudio.exe.sha256 --title "StreamForge Studio ${{ github.ref_name }}" --notes "Replacement for the old AI Clip Studio prototype. Windows x64 standalone EXE with bundled multilingual Whisper Tiny and FFmpeg. Real highlight ranking, vertical MP4 clips, karaoke captions and partner banners. Offline processing of local video; online imports depend on platform availability. Source, processing, speech recognition and packaged GUI checked in CI. No earnings or view guarantees."
